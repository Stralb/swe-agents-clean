name: Validate matched results

on:
  push:
    branches:
      - supervisor/**
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay aggregate matched results
        run: python3 scripts/reproduce_matched.py --check
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
