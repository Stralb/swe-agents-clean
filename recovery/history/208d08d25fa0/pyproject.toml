[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arno-research-reproducibility"
version = "0.0.1"
description = "Research reproducibility checks and provenance recovery"
requires-python = ">=3.10"
dependencies = ["packaging==25.0"]

[tool.setuptools]
packages = ["tools", "analysis", "src", "src.markers", "src.github", "src.filters", "src.pipeline", "src.utils", "src.runtime", "src.db", "src.artifacts", "src.scanners"]

[tool.setuptools.package-data]
"src.db" = ["schema.sql"]
