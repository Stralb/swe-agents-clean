name: Real OSV and Trivy candidate binary smoke — synthetic offline only

on:
  push:
    branches:
      - work/miner-core-consolidation-20261021

permissions:
  contents: read

jobs:
  verified-osv-trivy-no-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout private branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python for ephemeral binary integrity checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Acquire and SHA-256 verify genuine OSV 2.6.0 and Trivy 0.76.1
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/arno-real-dependency-bin"
          curl --fail --show-error --silent --location --retry 2 \
            --output "$RUNNER_TEMP/arno-real-dependency-bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64"
          printf '%s  %s\n' \
            "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108" \
            "$RUNNER_TEMP/arno-real-dependency-bin/osv-scanner" | sha256sum --check
          curl --fail --show-error --silent --location --retry 2 \
            --output "$RUNNER_TEMP/trivy_0.76.1_Linux-64bit.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz"
          printf '%s  %s\n' \
            "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0" \
            "$RUNNER_TEMP/trivy_0.76.1_Linux-64bit.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy_0.76.1_Linux-64bit.tar.gz" \
            -C "$RUNNER_TEMP/arno-real-dependency-bin" trivy
          chmod 0755 "$RUNNER_TEMP/arno-real-dependency-bin/osv-scanner" \
            "$RUNNER_TEMP/arno-real-dependency-bin/trivy"
          "$RUNNER_TEMP/arno-real-dependency-bin/osv-scanner" --version
          "$RUNNER_TEMP/arno-real-dependency-bin/trivy" --version
          cp requirements/repro_dependency_diff.txt \
            "$RUNNER_TEMP/arno-real-dependency-bin/repro_dependency_diff.txt"
      - name: Build throwaway verified-binary sandbox image
        shell: bash
        run: |
          docker build \
            --file tests/support/Dockerfile.real-dependency-engines \
            --tag arno-real-dependency-synthetic:20261021 \
            "$RUNNER_TEMP/arno-real-dependency-bin"
          docker image inspect \
            --format '{{.Id}}' arno-real-dependency-synthetic:20261021
      - name: Execute original OSV and Trivy parsing in isolated offline test
        shell: bash
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=384m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 2g \
            --cpus 2 \
            --user 65534:65534 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --workdir /workspace \
            --env HOME=/tmp \
            --env XDG_CACHE_HOME=/tmp/xcache \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env ARNO_RUN_REAL_DEPENDENCY_ENGINES=1 \
            --env ARNO_OSV_BINARY=/usr/local/bin/osv-scanner \
            --env ARNO_TRIVY_BINARY=/usr/local/bin/trivy \
            arno-real-dependency-synthetic:20261021 \
            python -m unittest \
              tests.test_miner_real_dependency_engines \
              tests.test_miner_real_osv_snapshot_workflow -v
