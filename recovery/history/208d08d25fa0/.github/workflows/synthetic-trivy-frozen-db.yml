name: Pinned Trivy candidate advisory DB — real offline scan

on:
  push:
    branches:
      - work/miner-core-consolidation-20261021

permissions:
  contents: read

jobs:
  real-trivy-frozen-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Checkout private work branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify Trivy binary release archive
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/arno-trivy-frozen-bin"
          curl --fail --show-error --silent --location --retry 2 \
            -o "$RUNNER_TEMP/trivy_0.76.1_Linux-64bit.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz"
          printf '%s  %s\n' \
            "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0" \
            "$RUNNER_TEMP/trivy_0.76.1_Linux-64bit.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy_0.76.1_Linux-64bit.tar.gz" \
            -C "$RUNNER_TEMP/arno-trivy-frozen-bin" trivy
          chmod 0755 "$RUNNER_TEMP/arno-trivy-frozen-bin/trivy"
          "$RUNNER_TEMP/arno-trivy-frozen-bin/trivy" --version
          cp requirements/repro_dependency_diff.txt \
            "$RUNNER_TEMP/arno-trivy-frozen-bin/repro_dependency_diff.txt"
      - name: Download and SHA-256 verify immutable September 2026 OCI advisory DB
        shell: bash
        run: |
          token="$(curl --fail --show-error --silent --location --retry 2 \
            "https://ghcr.io/token?service=ghcr.io&scope=repository%3Aaquasecurity%2Ftrivy-db%3Apull" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          registry="https://ghcr.io/v2/aquasecurity/trivy-db"
          manifest_digest="bfeab4910aea63f6053c238c6caa085583fdaea9f630150d3265a1e38c2544db"
          blob_digest="f834840e1109c7a3dc46244cf80bd00485a77a6a8ffe825fcd2aedbf22e5ec0d"
          curl --fail --show-error --silent --location --retry 2 \
            --header "Authorization: Bearer $token" \
            --header "Accept: application/vnd.oci.image.manifest.v1+json" \
            --output "$RUNNER_TEMP/frozen-trivy-manifest.json" \
            "$registry/manifests/sha256:$manifest_digest"
          printf '%s  %s\n' "$manifest_digest" \
            "$RUNNER_TEMP/frozen-trivy-manifest.json" | sha256sum --check
          python3 - "$RUNNER_TEMP/frozen-trivy-manifest.json" "$blob_digest" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          approved=sys.argv[2]
          layers=data.get("layers") or []
          assert any(layer.get("digest")=="sha256:"+approved and
                     layer.get("mediaType")=="application/vnd.aquasec.trivy.db.layer.v1.tar+gzip"
                     for layer in layers), "Unapproved DB layer"
          print("Immutable OCI DB layer digest:", approved)
          PY
          curl --fail --show-error --silent --location --retry 2 \
            --header "Authorization: Bearer $token" \
            --output "$RUNNER_TEMP/trivy-frozen-db.tar.gz" \
            "$registry/blobs/sha256:$blob_digest"
          printf '%s  %s\n' "$blob_digest" \
            "$RUNNER_TEMP/trivy-frozen-db.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/arno-trivy-frozen-db"
          tar -xzf "$RUNNER_TEMP/trivy-frozen-db.tar.gz" \
            -C "$RUNNER_TEMP/arno-trivy-frozen-db" \
            metadata.json trivy.db
          sha256sum "$RUNNER_TEMP/arno-trivy-frozen-db/metadata.json" \
            "$RUNNER_TEMP/arno-trivy-frozen-db/trivy.db"
          ls -lh "$RUNNER_TEMP/arno-trivy-frozen-db"
      - name: Build temporary Trivy runtime image
        shell: bash
        run: |
          docker build --file tests/support/Dockerfile.real-trivy-db \
            --tag arno-real-trivy-db-candidate:20261021 \
            "$RUNNER_TEMP/arno-trivy-frozen-bin"
      - name: Scan only fixed public package versions under no-network sandbox
        shell: bash
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=256m,mode=1777 \
            --mount "type=bind,source=$RUNNER_TEMP/arno-trivy-frozen-db,target=/tmp/trivy-cache/db,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 3g \
            --cpus 2 \
            --user 65534:65534 \
            --workdir /workspace \
            --env HOME=/tmp \
            --env XDG_CACHE_HOME=/tmp/cache \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env ARNO_RUN_PINNED_TRIVY_DB=1 \
            --env ARNO_TRIVY_BINARY=/usr/local/bin/trivy \
            arno-real-trivy-db-candidate:20261021 \
            python -m unittest \
              tests.test_miner_real_trivy_frozen_db \
              tests.test_miner_real_trivy_worktree_worker -v
