name: Synthetic-only checksum-verified Semgrep CLI smoke

on:
  push:
    branches:
      - work/miner-core-consolidation-20261021

permissions:
  contents: read

jobs:
  archived-semgrep-real-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout private work branch with no persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire and checksum-verify official Semgrep 1.181.0 Linux wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/arno-semgrep-venv"
          mkdir -p "$RUNNER_TEMP/arno-semgrep-wheel"
          "$RUNNER_TEMP/arno-semgrep-venv/bin/python" -m pip download \
            --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/arno-semgrep-wheel" \
            semgrep==1.181.0
          wheel="$RUNNER_TEMP/arno-semgrep-wheel/semgrep-1.181.0-cp310.cp311.cp312.cp313.cp314.py310.py311.py312.py313.py314-none-manylinux_2_34_x86_64.whl"
          test -f "$wheel"
          printf '%s  %s\n' \
            'c142ec04a2ed144970cb0a92f6877651dd3c088505eec737bb7f4db7ae5f0ffa' \
            "$wheel" | sha256sum --check
          "$RUNNER_TEMP/arno-semgrep-venv/bin/python" -m pip install --disable-pip-version-check "$wheel"
          "$RUNNER_TEMP/arno-semgrep-venv/bin/semgrep" --version
          "$RUNNER_TEMP/arno-semgrep-venv/bin/python" -m pip freeze
      - name: Execute exact archived Semgrep runner on synthetic-only local Git fixture
        shell: bash
        env:
          ARNO_RUN_PINNED_SEMGREP: '1'
        run: |
          export ARNO_SEMGREP_EXECUTABLE="$RUNNER_TEMP/arno-semgrep-venv/bin/semgrep"
          python -m unittest tests.test_miner_archived_real_semgrep_smoke -v

  archived-semgrep-network-none:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python 3.11 for verified wheel acquisition
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify the candidate Semgrep wheel checksum
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/arno-semgrep-sandbox-build"
          python -m pip download --no-deps --only-binary=:all: \
            --dest "$RUNNER_TEMP/arno-semgrep-sandbox-build" semgrep==1.181.0
          wheel="$RUNNER_TEMP/arno-semgrep-sandbox-build/semgrep-1.181.0-cp310.cp311.cp312.cp313.cp314.py310.py311.py312.py313.py314-none-manylinux_2_34_x86_64.whl"
          test -f "$wheel"
          printf '%s  %s\n' \
            'c142ec04a2ed144970cb0a92f6877651dd3c088505eec737bb7f4db7ae5f0ffa' \
            "$wheel" | sha256sum --check
      - name: Build a throwaway container image from the verified wheel
        shell: bash
        run: |
          docker build --file tests/support/Dockerfile.semgrep-synthetic \
            --tag arno-semgrep-synthetic:1.181.0 \
            "$RUNNER_TEMP/arno-semgrep-sandbox-build"
          docker image inspect --format '{{.Id}}' arno-semgrep-synthetic:1.181.0
      - name: Run real Semgrep smoke inside a no-network, read-only sandbox
        shell: bash
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 2g \
            --cpus 2 \
            --user 65534:65534 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --workdir /workspace \
            --env HOME=/tmp \
            --env SEMGREP_ENABLE_VERSION_CHECK=0 \
            --env SEMGREP_SEND_METRICS=off \
            --env XDG_CACHE_HOME=/tmp/semgrep-cache \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env ARNO_RUN_PINNED_SEMGREP=1 \
            --env ARNO_SEMGREP_EXECUTABLE=/usr/local/bin/semgrep \
            arno-semgrep-synthetic:1.181.0 \
            python -m unittest tests.test_miner_archived_real_semgrep_smoke -v
