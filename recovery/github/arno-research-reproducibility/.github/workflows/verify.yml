name: Reproducibility tooling checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile checker
        run: python -m compileall -q tools analysis tests
      - name: Test using synthetic fixtures (no private datasets)
        run: python -m unittest discover -s tests -v
